plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.liquidglassuiandroid'
version = '1.2.2'

android {
  namespace "expo.modules.liquidglassuiandroid"
  defaultConfig {
    versionCode 1
    versionName "1.2.2"
  }
  lintOptions {
    abortOnError false
  }
}

// No Jetpack Compose: every component is a plain Android View drawn with RenderNode +
// RenderEffect. Lighter, and it can never hit Compose's "not attached to a window" crash.
